<header><div><div class="logo">ATOM FORGE</div><div class="subtitle">PARTICLE ASSEMBLY LAB</div></div><div class="tools"><div class="view-switch"><button id="view3d" aria-pressed="true">3D</button><button id="view2d" aria-pressed="false">2D</button></div><button id="sound" aria-pressed="false">SOUND: OFF</button></div></header>
<div id="stage"><div class="vignette"></div><div id="scan" class="scan"></div><div class="alert" role="alert">THIS ATOM CANNOT EXIST</div><div id="fallback" hidden>3D view needs WebGL. The data panels still work.</div></div>
<main>
<section id="controlPanel" class="panel"><h2>PARTICLE CONTROL</h2>
<div class="particle" style="--particle:var(--mg)"><label for="protons"><span class="dot" style="color:var(--mg)"></span>Protons</label><div class="stepper"><button data-field="Z" data-step="-1" aria-label="Protons −">−</button><input id="protons" type="number" min="1" max="118" inputmode="numeric"><button data-field="Z" data-step="1" aria-label="Protons +">+</button></div></div>
<div class="particle" style="--particle:#9fdcff"><label for="neutrons"><span class="dot" style="color:#9fdcff"></span>Neutrons</label><div class="stepper"><button data-field="N" data-step="-1" aria-label="Neutrons −">−</button><input id="neutrons" type="number" min="0" max="200" inputmode="numeric"><button data-field="N" data-step="1" aria-label="Neutrons +">+</button></div></div>
<div class="particle" style="--particle:var(--cy)"><label for="electrons"><span class="dot" style="color:var(--cy)"></span>Electrons</label><div class="stepper"><button data-field="Z" data-step="-1" aria-label="Electrons −">−</button><input id="electrons" type="number" min="1" max="118" inputmode="numeric"><button data-field="Z" data-step="1" aria-label="Electrons +">+</button></div></div>
<label class="switch" for="auto">Auto-fill neutrons<input id="auto" type="checkbox" checked></label><button id="random">Random element</button><p class="hint">Drag the atom to rotate it.</p></section>
<section id="dataPanel" class="panel"><h2>ELEMENT DATA</h2><div class="nuclide"><div class="numbers"><span id="mass"></span><span id="atomic"></span></div><span id="symbol"></span></div><div id="elementName"></div><div id="category" class="badge"></div><dl><div><dt>Atomic number</dt><dd id="statZ"></dd></div><div><dt>Mass number</dt><dd id="statMass"></dd></div><div><dt>Electron arrangement</dt><dd id="arrangement"></dd></div><div><dt>Number of shells</dt><dd id="shellCount"></dd></div><div><dt>Period</dt><dd id="period"></dd></div><div><dt>Group</dt><dd id="group"></dd></div></dl><div class="status"><span class="dot"></span><strong id="statusWord"></strong><p id="statusLine"></p></div></section>
<section id="tablePanel" class="panel"><h2>PERIODIC TABLE</h2><div id="periodic" class="periodic"></div><div id="legend" class="legend"></div></section>
</main><footer>By The Atom MAXXING</footer>

   fitHeight=desktop?Math.max(80,table.top-88-24):h-90;

  }
  function setView(){

   controls.autoRotate=state.view==='3d';controls.enableRotate=state.view==='3d';controls.enabled=state.view==='3d';
  }

  renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();$('fallback').hidden=false});
  function frame(nowMs){

   }

   let index=0;
   const tilt=[.25,.9,.5,1.2,.7,1.05,.4];
   for(const s of shells3d){

   platform.scale.setScalar(platformRadius);platform.position.y=platformY;

   grid.material.opacity=.07*platformFade;platformDisc.material.opacity=.08*platformFade;rim.material.opacity=.28*platformFade;wedge.material.opacity=.04*platformFade;{const pc=sceneStatus==='none'?0xff3355:sceneStatus==='unstable'?0xffb42e:0x3ef0ff;rim.material.color.setHex(pc);wedge.material.color.setHex(pc);platformDisc.material.color.setHex(sceneStatus==='none'?0xff2040:0x1fc6e8)}wedge.rotation.z+=dt*.3;

    flash.scale.setScalar(radius*4+boom*40);flash.material.opacity=Math.max(0,1-boom/.5);
    shock.scale.setScalar(radius+boom*28);shock.material.opacity=Math.max(0,1-boom/.9);shock.quaternion.copy(camera.quaternion);

   }else{world.position.lerp(tmp.set(0,0,0),blend)}
   const h=stage.clientHeight,w=stage.clientWidth,verticalHalf=Math.tan(THREE.MathUtils.degToRad(camera.fov/2)),horizontalHalf=verticalHalf*w/h;

   else camera.position.setLength(distance);
   camera.lookAt(0,0,0);if(controls.enabled)controls.update(dt);

  }
  requestAnimationFrame(frame);
 }catch(error){renderer?.dispose();$('fallback').hidden=false;console.error('Atom Forge renderer:',error)}
}
